<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a85454"/>
      <stop offset="1" stop-color="#7a2e2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#e1d4c2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e1d4c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78d78"/>
      <stop offset="1" stop-color="#6e473b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2a0c0c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>

  <!-- Browser window -->
  <g filter="url(#shadow)">
    <rect x="60" y="80" width="460" height="370" rx="18" fill="#f8f3ec"/>
    <path d="M78 80h424a18 18 0 0 1 18 18v20H60V98a18 18 0 0 1 18-18z" fill="#e1d4c2"/>
    <circle cx="84" cy="99" r="5" fill="#6e473b"/>
    <circle cx="100" cy="99" r="5" fill="#a78d78"/>
    <circle cx="116" cy="99" r="5" fill="#beb5a9"/>
    <rect x="160" y="90" width="280" height="18" rx="9" fill="#f8f3ec"/>

    <!-- Nav -->
    <rect x="84" y="138" width="54" height="11" rx="5.5" fill="#291c0e"/>
    <rect x="300" y="140" width="34" height="7" rx="3.5" fill="#a78d78"/>
    <rect x="344" y="140" width="34" height="7" rx="3.5" fill="#a78d78"/>
    <rect x="388" y="140" width="34" height="7" rx="3.5" fill="#a78d78"/>
    <rect x="440" y="133" width="58" height="20" rx="10" fill="#6e473b"/>

    <!-- Hero copy -->
    <rect x="84" y="180" width="190" height="18" rx="5" fill="#291c0e"/>
    <rect x="84" y="206" width="150" height="18" rx="5" fill="#6e473b"/>
    <rect x="84" y="240" width="180" height="7" rx="3.5" fill="#beb5a9"/>
    <rect x="84" y="254" width="150" height="7" rx="3.5" fill="#beb5a9"/>
    <rect x="84" y="278" width="86" height="24" rx="12" fill="#291c0e"/>
    <rect x="180" y="278" width="70" height="24" rx="12" fill="none" stroke="#a78d78" stroke-width="2"/>

    <!-- Hero image -->
    <rect x="296" y="172" width="200" height="134" rx="14" fill="url(#hero)"/>
    <circle cx="452" cy="206" r="16" fill="#e1d4c2" opacity="0.85"/>
    <path d="M296 286l52-50 38 34 30-24 80 62v4a14 14 0 0 1-14 14H310a14 14 0 0 1-14-14z" fill="#291c0e" opacity="0.55"/>

    <!-- Feature cards -->
    <g fill="#efe6da">
      <rect x="84" y="326" width="130" height="100" rx="12"/>
      <rect x="225" y="326" width="130" height="100" rx="12"/>
      <rect x="366" y="326" width="130" height="100" rx="12"/>
    </g>
    <g fill="#6e473b">
      <rect x="98" y="340" width="24" height="24" rx="7"/>
      <rect x="239" y="340" width="24" height="24" rx="7"/>
      <rect x="380" y="340" width="24" height="24" rx="7"/>
    </g>
    <g fill="#a78d78">
      <rect x="98" y="378" width="90" height="7" rx="3.5"/>
      <rect x="98" y="392" width="70" height="7" rx="3.5"/>
      <rect x="239" y="378" width="90" height="7" rx="3.5"/>
      <rect x="239" y="392" width="70" height="7" rx="3.5"/>
      <rect x="380" y="378" width="90" height="7" rx="3.5"/>
      <rect x="380" y="392" width="70" height="7" rx="3.5"/>
    </g>
  </g>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="452" y="236" width="118" height="236" rx="20" fill="#291c0e"/>
    <rect x="460" y="246" width="102" height="216" rx="14" fill="#f8f3ec"/>
    <rect x="490" y="252" width="42" height="7" rx="3.5" fill="#291c0e"/>
    <rect x="470" y="274" width="60" height="9" rx="4.5" fill="#291c0e"/>
    <rect x="470" y="289" width="44" height="9" rx="4.5" fill="#6e473b"/>
    <rect x="470" y="310" width="82" height="62" rx="10" fill="url(#hero)"/>
    <rect x="470" y="384" width="82" height="6" rx="3" fill="#beb5a9"/>
    <rect x="470" y="396" width="64" height="6" rx="3" fill="#beb5a9"/>
    <rect x="470" y="416" width="50" height="18" rx="9" fill="#291c0e"/>
  </g>
</svg>
