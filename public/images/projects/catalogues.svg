<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94606f"/>
      <stop offset="1" stop-color="#4a2a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#e1d4c2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e1d4c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e1d4c2"/>
      <stop offset="1" stop-color="#a78d78"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#291c0e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#291c0e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#291c0e" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1a0b10" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>

  <!-- Closed catalogue behind -->
  <g filter="url(#shadow)" transform="rotate(8 430 230)">
    <rect x="340" y="60" width="200" height="270" rx="8" fill="#291c0e"/>
    <rect x="340" y="60" width="10" height="270" rx="4" fill="#1a1108"/>
    <text x="368" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#e1d4c2">CATALOGUE</text>
    <rect x="368" y="114" width="60" height="3" fill="#a78d78"/>
    <circle cx="440" cy="210" r="56" fill="#6e473b"/>
    <rect x="422" y="176" width="36" height="72" rx="10" fill="#e1d4c2"/>
    <rect x="432" y="164" width="16" height="16" rx="3" fill="#a78d78"/>
    <rect x="368" y="290" width="90" height="7" rx="3.5" fill="#a78d78"/>
  </g>

  <!-- Open spread -->
  <g filter="url(#shadow)" transform="rotate(-5 300 300)">
    <rect x="70" y="130" width="230" height="300" fill="#faf6f0"/>
    <rect x="300" y="130" width="230" height="300" fill="#f2eadf"/>
    <rect x="280" y="130" width="40" height="300" fill="url(#spine)"/>

    <!-- Left page: hero product -->
    <rect x="90" y="150" width="190" height="140" rx="6" fill="url(#photo)"/>
    <ellipse cx="185" cy="270" rx="46" ry="8" fill="#6e473b" opacity="0.3"/>
    <rect x="166" y="196" width="38" height="76" rx="10" fill="#6e473b"/>
    <rect x="176" y="184" width="18" height="16" rx="3" fill="#291c0e"/>
    <rect x="172" y="222" width="26" height="22" rx="3" fill="#e1d4c2"/>
    <rect x="90" y="306" width="120" height="12" rx="4" fill="#291c0e"/>
    <rect x="90" y="326" width="170" height="6" rx="3" fill="#beb5a9"/>
    <rect x="90" y="338" width="140" height="6" rx="3" fill="#beb5a9"/>
    <rect x="90" y="358" width="64" height="22" rx="11" fill="#6e473b"/>
    <text x="104" y="373" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#faf6f0">₹1,499</text>
    <text x="90" y="415" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#a78d78">04</text>

    <!-- Right page: product grid -->
    <g fill="url(#photo)">
      <rect x="320" y="150" width="90" height="80" rx="6"/>
      <rect x="420" y="150" width="90" height="80" rx="6"/>
      <rect x="320" y="270" width="90" height="80" rx="6"/>
      <rect x="420" y="270" width="90" height="80" rx="6"/>
    </g>
    <g fill="#6e473b">
      <circle cx="365" cy="190" r="20"/>
      <rect x="448" y="168" width="34" height="46" rx="8"/>
      <rect x="345" y="296" width="40" height="34" rx="6"/>
      <circle cx="465" cy="310" r="22" fill="#291c0e"/>
    </g>
    <g fill="#291c0e">
      <rect x="320" y="238" width="60" height="7" rx="3.5"/>
      <rect x="420" y="238" width="60" height="7" rx="3.5"/>
      <rect x="320" y="358" width="60" height="7" rx="3.5"/>
      <rect x="420" y="358" width="60" height="7" rx="3.5"/>
    </g>
    <g fill="#a78d78">
      <rect x="320" y="250" width="40" height="6" rx="3"/>
      <rect x="420" y="250" width="40" height="6" rx="3"/>
      <rect x="320" y="370" width="40" height="6" rx="3"/>
      <rect x="420" y="370" width="40" height="6" rx="3"/>
    </g>
    <text x="500" y="415" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#a78d78">05</text>
  </g>
</svg>
